name: Lint

on:
  pull_request:
  workflow_call: # from release.yml, before tagging

permissions: {}

# A literal prefix, not github.workflow: in a called workflow that is the caller's name, so Lint
# and Test would share a group when Release calls them both.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.11" # same as the Dockerfile
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run mypy
