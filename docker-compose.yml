# Oil tank level reader.
#
# Before the first start:
#   mkdir -p data && sudo chown 65532:65532 data
#   cp .env.example .env    # then fill it in: camera URL, MQTT broker, ... (git-ignored)
#
# Note: the long-running `run` command and `healthcheck` arrive in milestone M5. Until then, use
# one-off commands, e.g.:
#   docker compose run --rm oiltank read

services:
  oiltank:
    build: .
    image: oiltank:latest
    container_name: oiltank
    command: ["run"]
    restart: unless-stopped

    # Rootless + locked down: distroless nonroot user, read-only root FS, no capabilities.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    volumes:
      - ./data:/data # calibration.yaml, oiltank.db, archive/ (must be owned by 65532)

    env_file: .env # every setting, plus TZ (see .env.example); required

    # healthcheck:            # enabled in M5, once `oiltank healthcheck` exists
    #   test: ["CMD", "/app/.venv/bin/oiltank", "healthcheck"]
    #   interval: 60s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

    # GPU inference (post-MVP): build the GPU image variant and uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
