# Oil tank level reader.
#
# Before the first start:
#   cp .env.example .env    # then fill it in: camera URL, MQTT broker, ... (git-ignored)
#   mkdir -p data && sudo chown 65532:65532 data
#   docker compose pull     # the published image, for amd64 and arm64 (e.g. a Raspberry Pi)
#   docker compose run --rm oiltank calibrate init --camera --top X Y --bottom X Y   # see README
#
# Then `docker compose up -d`. One-off commands run alongside, e.g.:
#   docker compose run --rm oiltank calibrate show --camera
#
# To update: `docker compose pull && docker compose up -d`. From a checkout, `docker compose build`
# builds the image locally under the same name instead (see CONTRIBUTING.md).

services:
  oiltank:
    image: ghcr.io/icooper/oiltank:latest # or pin a major version, e.g. :1
    build: .
    container_name: oiltank
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 30s # lets a reading in progress finish before it says "offline"

    # Rootless + locked down: distroless nonroot user, read-only root FS, no capabilities.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    volumes:
      - ./data:/data # calibration.yaml, oiltank.db, archive/ (must be owned by 65532)

    env_file: .env # every setting, plus TZ (see .env.example); required

    healthcheck: # the service's loop refreshes a heartbeat file at least every 30 s
      test: ["CMD", "/app/.venv/bin/oiltank", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    # GPU inference (post-MVP): build the GPU image variant and uncomment.
    # deploy:
