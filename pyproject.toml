[project]
name = "oiltank"
# Placeholder: releases are git tags made by python-semantic-release, and the image build
# stamps the real version (.github/workflows/build-image.yml). Never edit this by hand.
version = "0.0.0"
description = "Reads a heating oil tank float gauge from IP camera frames and publishes the level to Home Assistant over MQTT."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ian Cooper" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
oiltank = "oiltank.cli:app"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "PTH", # use pathlib
    "NPY", # numpy-specific
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs Docker (mosquitto); run with `uv run pytest -m integration`",
]

[tool.uv]
# The uv version for everyone: setup-uv in the workflows reads it from here, the Dockerfile's
# UV_VERSION default must match (tests/unit/test_uv_version.py), and uv refuses to run with any
# other version, so a newer uv can't rewrite uv.lock in a way CI and Docker don't understand.
required-version = "==0.11.11"
# Rebuild the (non-editable) package when source changes, not only when pyproject.toml does;
# otherwise Docker builds with a warm uv cache install a stale wheel. The web UI's static files
# are part of the package too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/oiltank/web/static/**" },
]

# Releases are tag-only: main needs signed commits through PRs, so CI tags the merge commit and
# creates the GitHub Release, and never pushes a commit. See CONTRIBUTING.md.
[tool.semantic_release]
tag_format = "v{version}"
allow_zero_version = false # the first release is 1.0.0
commit_parser = "conventional"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# Squash merges use the PR title as the commit message; that title alone decides the bump.
parse_squash_commits = false
