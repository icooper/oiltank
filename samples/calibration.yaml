# oiltank calibration for the sample frames in this directory; frame0.jpg is the reference.
#
# The axis endpoints bound the disc centre's travel. They were set by hand with the diagnostic
# image: the top is where the disc would touch the dome cap, the bottom where it would rest on the
# base ring. They set where the reader looks, not the scale.
#
# The scale comes from `points`. The owner put the tank at about 98% on 2026-10-13, a week after a
# fill, and `oiltank calibrate point --fraction 0.98` recorded where the disc was in the sample
# frames. With E at the bottom of travel, that puts F at y ≈ 1045, well below the dome cap. Check
# it with `oiltank calibrate show -c samples/calibration.yaml --diagnostic check.jpg`.
#
# `oiltank calibrate` keeps this header comment when it rewrites the file.
version: 1
reference_image: frame0.jpg
frame_size: [3840, 2160]
axis:
  top: [2166.0, 1020.0]
  bottom: [2166.0, 1172.0]
  half_width: 50.0
  margin: 0.25
disc:
  width: 64.0
  height: 38.0
anchor:
  rect: [1950, 1185, 290, 165]
  search: 48
  min_score: 0.6
  recalibrate_shift: 20.0
# One point, so the scale also takes E as the bottom of travel (t = 0).
points:
  - {at: [2168.0, 1047.5], fraction: 0.98, note: '2026-10-13: owner reports ~98%, a week after a fill'}
